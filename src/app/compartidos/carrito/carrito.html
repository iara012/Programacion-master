<div class="tablaCarrito">

  <table>
    <thead>
      <tr>
        <th>Producto</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      @for (p of productosEnCarro; track p.id) {
      <tr>
        <td>{{ p.nombre }}</td>
        <td>$ {{ p.precio }}</td>
        <td>{{ p.cantidad }}</td>

        <td>
          <button (click)="disminuirCantidad(p.id)">-</button>

          <button (click)="aumentarCantidad(p.id)">+</button>

          <button (click)="eliminarProducto(p.id)">
            Eliminar
          </button>
        </td>
      </tr>
      }
    </tbody>

  </table>

  <div class="total">
    <h3>Total: ${{ obtenerTotal() }}</h3>
  </div>

</div>
